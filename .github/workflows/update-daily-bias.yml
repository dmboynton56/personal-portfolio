name: Update Daily Bias Predictions

on:
  schedule:
    # Runs daily at 9:30 AM EST (14:30 UTC during EST, 13:30 UTC during EDT)
    - cron: '30 14 * * 1-5'  # Weekdays only during EST (Nov-Mar)
    - cron: '30 13 * * 1-5'  # Weekdays only during EDT (Mar-Nov)
  workflow_dispatch: # Allow manual trigger

jobs:
  update-bias:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        
    - name: Install Python dependencies
      run: |
        pip install pandas numpy scikit-learn yfinance pytz
        
    - name: Run Daily Bias Prediction
      run: |
        cd scripts
        python fetch-daily-bias.py
        
    - name: Check for changes
      id: verify-changed-files
      run: |
        if [ -n "$(git status --porcelain)" ]; then
          echo "changed=true" >> $GITHUB_OUTPUT
        else
          echo "changed=false" >> $GITHUB_OUTPUT
        fi
        
    - name: Commit and push if changes
      if: steps.verify-changed-files.outputs.changed == 'true'
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add public/data/daily_bias_predictions.json
        git commit -m "🤖 Update daily bias predictions - $(date -u)"
        git push 