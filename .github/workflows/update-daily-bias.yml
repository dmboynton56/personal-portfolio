name: Update Daily Bias Predictions

on:
  schedule:
    # Runs daily at 9:35 AM EST / 10:35 AM EDT (after first 5-min candle closes) on weekdays
    - cron: '35 14 * * 1-5'
  workflow_dispatch: # Allow manual trigger

jobs:
  update-bias:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        
    - name: Install Python dependencies
      run: |
        pip install pandas numpy scikit-learn yfinance pytz
        
    - name: Run Daily Bias Prediction
      run: python scripts/fetch-daily-bias.py
        
    - name: Check for changes
      id: verify-changed-files
      run: |
        if [ -n "$(git status --porcelain)" ]; then
          echo "changed=true" >> $GITHUB_OUTPUT
        else
          echo "changed=false" >> $GITHUB_OUTPUT
        fi
        
    - name: Commit and push if changes
      if: steps.verify-changed-files.outputs.changed == 'true'
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add public/data/daily_bias_predictions.json
        git commit -m "🤖 Update daily bias predictions - $(date -u)"
        git push 