name: Trigger Sports Edge API

on:
  schedule:
    # Every day at 13:00 UTC (06:00 America/Denver)
    - cron: '0 13 * * *'
  workflow_dispatch:

jobs:
  ping-api:
    runs-on: ubuntu-latest
    steps:
      - name: Call Sports Edge cron route
        env:
          CRON_URL: ${{ secrets.SPORTS_EDGE_CRON_URL }}
          CRON_SECRET: ${{ secrets.SPORTS_EDGE_CRON_SECRET }}
        run: |
          if [ -z "$CRON_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "SPORTS_EDGE_CRON_URL or SPORTS_EDGE_CRON_SECRET is not set" >&2
            exit 1
          fi
          echo "Calling $CRON_URL"
          curl -fsSL -X POST "$CRON_URL" \
            -H "x-cron-secret: $CRON_SECRET"
